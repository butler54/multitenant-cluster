{{- if .Values.vlan150.nncp.enabled }}
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: {{ .Values.vlan150.nncp.name | default "vlan150-config" }}
spec:
  nodeSelector:
    node-role.kubernetes.io/master: ""
  desiredState:
    ovn:
      bridge-mappings:
      - localnet: {{ .Values.vlan150.name | default "br-vlan150" }}
        bridge: {{ .Values.vlan150.nncp.bridgeName | default "br-vlan150" }}
        state: present
    interfaces:
      - name: {{ .Values.vlan150.nncp.vlanInterface | default "eno12399.150" }}
        type: vlan
        state: up
        vlan:
          base-iface: {{ .Values.vlan150.nncp.baseInterface | default "eno12399" }}
          id: {{ .Values.vlan150.vlanID | default 150 }}
        controller: {{ .Values.vlan150.nncp.bridgeName | default "br-vlan150" }}
      - name: {{ .Values.vlan150.nncp.bridgeName | default "br-vlan150" }}
        type: ovs-bridge
        state: up
        bridge:
          port:
            - name: {{ .Values.vlan150.nncp.vlanInterface | default "eno12399.150" }}
{{- end }}

