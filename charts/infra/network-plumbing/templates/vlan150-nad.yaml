{{- if .Values.vlan150.enabled }}
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .Values.vlan150.name | default "vlan150-localnet" }}
  namespace: {{ .Values.vlan150.namespace | default "default" }}
  annotations:
    description: "Secondary network on VLAN 150 using dedicated OVS bridge {{ .Values.vlan150.nncp.bridgeName | default "br-vlan150" }}"
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "{{ .Values.vlan150.name | default "vlan150-localnet" }}",
      "type": "ovn-k8s-cni-overlay",
      "topology": "localnet",
      "subnets": "{{ .Values.vlan150.subnet | default "172.25.50.0/24" }}",
      "mtu": {{ .Values.vlan150.mtu | default 1500 }},
      "netAttachDefName": "{{ .Values.vlan150.namespace | default "default" }}/{{ .Values.vlan150.name | default "vlan150-localnet" }}"
    }
{{- end }}

