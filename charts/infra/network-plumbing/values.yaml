# Network Plumbing Configuration
# This chart configures network interfaces and attachments for the cluster

# VLAN 150 Configuration for localnet and CUDN support
vlan150:
  enabled: true
  name: "br-vlan157"
  namespace: "secondary-network"
  vlanID: 157
  subnet: "172.25.57.0/24"
  mtu: 1500
  
  # NodeNetworkConfigurationPolicy to create VLAN interface and dedicated OVS bridge
  nncp:
    enabled: true
    name: "vlan157-config"
    baseInterface: "eno12399"
    vlanInterface: "eno12399.157"
    bridgeName: "br-vlan157"  # Dedicated bridge, separate from main br-ex
  
  # Cluster User Defined Network configuration
  cudn:
    enabled: true
    name: "vlan157-cudn"
    namespace: "udn-and-secondary-network"
    subnet: "10.150.0.0/16"
  


